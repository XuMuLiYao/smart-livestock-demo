    function forceFullScreenViewport() {
      const container = document.getElementById('iframe-container');
      const frame = document.getElementById('streamlit-frame');
      if (!container || !frame) return;
      
      const vv = window.visualViewport;
      let w = (vv && vv.width) ? Math.round(vv.width) : 0;
      let h = (vv && vv.height) ? Math.round(vv.height) : 0;
      
      if (!w || w <= 0) {
        w = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth || screen.width;
      }
      if (!h || h <= 0) {
        h = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight || screen.height;
      }
      
      container.style.setProperty('width', w + 'px', 'important');
      container.style.setProperty('height', h + 'px', 'important');
      frame.style.setProperty('width', w + 'px', 'important');
      frame.style.setProperty('min-width', w + 'px', 'important');
      frame.style.setProperty('max-width', w + 'px', 'important');
      frame.style.setProperty('height', h + 'px', 'important');
      frame.style.setProperty('min-height', h + 'px', 'important');
    }

    window.addEventListener('resize', forceFullScreenViewport);
    window.addEventListener('orientationchange', function() {
      setTimeout(forceFullScreenViewport, 150);
    });
    window.addEventListener('pageshow', forceFullScreenViewport);
    document.addEventListener('DOMContentLoaded', forceFullScreenViewport);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', forceFullScreenViewport);
      window.visualViewport.addEventListener('scroll', forceFullScreenViewport);
    }
    forceFullScreenViewport();

    // 轮询校准：前 3 秒每 500 毫秒同步一次，防范手机浏览器地址栏收起时的视口延迟变化
    let calibrateCount = 0;
    const calibrateTimer = setInterval(function() {
      forceFullScreenViewport();
      calibrateCount++;
      if (calibrateCount >= 6) clearInterval(calibrateTimer);
    }, 500);

    function setProgress(pct) {
      const p = document.getElementById('loading-progress');
      if (p) p.style.width = pct + '%';
    }

    // 1. iframe 加载成功回调：平滑移除遮罩层
    function onFrameLoaded() {
      if (isLoaded) return;
      isLoaded = true;
      setProgress(100);
      forceFullScreenViewport();
      const loader = document.getElementById('loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.display = 'none';
          forceFullScreenViewport();
        }, 400);
      }
    }

    // 2. 超时多阶段智能加速提醒 (按时间递进更新提示与进度)
    setTimeout(() => {
      if (!isLoaded) {
        setProgress(45);
        const tip = document.getElementById('loading-status-tip');
        if (tip) {
          tip.innerHTML = "正在校验八大畜禽指标库与算法模型缓存，请稍候...";
          tip.style.color = "#58A6FF";
        }
      }
    }, 2000);

    setTimeout(() => {
      if (!isLoaded) {
        setProgress(70);
        const tip = document.getElementById('loading-status-tip');
        if (tip) {
          tip.innerHTML = "云端节点正在就绪中（若处于节能休眠通常需 10~15 秒）...";
          tip.style.color = "#E3B341";
        }
      }
    }, 5000);

    // 提前在第 8.5 秒呈现一键直达唤醒按钮，免除移动端过长等待
    setTimeout(() => {
      if (!isLoaded) {
        setProgress(85);
        const tip = document.getElementById('loading-status-tip');
        const btn = document.getElementById('timeout-wake-btn');
        if (tip) {
          tip.innerHTML = "提示：检测到云端容器可能处于节电待机模式，建议点击下方一键唤醒";
          tip.style.color = "#F85149";
        }
        if (btn) {
          btn.style.display = 'inline-block';
        }
      }
    }, 8500);

    // 3. 移动端容错兜底：若 15 秒后 iframe 未抛错误，允许用户点击遮罩直接进入
    setTimeout(() => {
      if (!isLoaded) {
        const loader = document.getElementById('loading-screen');
        if (loader) {
          loader.style.cursor = 'pointer';
          loader.title = '若大屏已在后台渲染完成，点击此处可直接进入';
          loader.onclick = function() { onFrameLoaded(); };
        }
      }
    }, 15000);

    // 4. 纯净平滑刷新 (绝不拼接动态查询参数，保持纯净地址)
    function pureReloadFrame() {
      const frame = document.getElementById('streamlit-frame');
      if (frame) {
        frame.src = STREAMLIT_ORIGIN + "/?embed=true";
        forceFullScreenViewport();
      }
    }

    // 5. 用户点击唤醒后的自愈对账 (在用户新标签页唤醒后，自动调度主 iframe 重新对齐)
    function scheduleAutoReload() {
      setTimeout(pureReloadFrame, 10000);
      setTimeout(pureReloadFrame, 18000);
    }

    // 6. 悬浮助手最小化与展开
    function minimizeAssistant() {
      document.getElementById('wakeup-assistant').style.display = 'none';
      document.getElementById('minimized-trigger').style.display = 'flex';
    }

    function restoreAssistant() {
      document.getElementById('wakeup-assistant').style.display = 'flex';
      document.getElementById('minimized-trigger').style.display = 'none';
    }

    // 7. 首屏稳定建立连接 60 秒后，再启动温和后台保活 (严格避开开屏握手冲突)
    setTimeout(() => {
      setInterval(() => {
        try {
          fetch(STREAMLIT_ORIGIN + "/_stcore/health", { mode: "no-cors", cache: "no-store" }).catch(() => {});
        } catch (e) {}
      }, 600000); // 每 10 分钟发送一次温和保活脉冲
    }, 60000);
  </script>
</body>
</html>
